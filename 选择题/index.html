<script>
(()=>{const data=window.CHOICE_DATA,list=document.querySelector('#question-list'),nav=document.querySelector('#category-nav'),search=document.querySelector('#search'),kindFilter=document.querySelector('#kind-filter'),sort=document.querySelector('#sort');const wrong=JSON.parse(localStorage.getItem('md-choice-wrong-counts')||'{}');let category='全部类别';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories=['全部类别',...data.categories];nav.innerHTML=categories.map(c=>`<button class="${c===category?'active':''}" data-category="${esc(c)}">${esc(c)}<em>${c==='全部类别'?data.questions.length:data.questions.filter(q=>q.category===c).length}</em></button>`).join('');function render(){const term=search.value.trim().toLowerCase();let items=data.questions.filter(q=>(category==='全部类别'||q.category===category)&&(!kindFilter.value||q.kind===kindFilter.value)&&(!term||q.search.toLowerCase().includes(term)));if(sort.value==='wrong')items.sort((a,b)=>(Number(wrong[b.id])||0)-(Number(wrong[a.id])||0)||a.id-b.id);document.querySelector('#result-count').textContent=`显示 ${items.length} / ${data.questions.length} 道选择题`;document.querySelector('#wrong-total').textContent=Object.values(wrong).reduce((s,n)=>s+(Number(n)||0),0);list.innerHTML=items.length?items.map(q=>{const n=Number(wrong[q.id])||0;const opts=Object.entries(q.options).map(([k,v])=>`<div class="option"><span class="option-letter">${k}.</span>${esc(v)}</div>`).join('');const imgs=q.images.map(src=>`<img loading="lazy" src="${esc(src)}" alt="第${q.id}题原图">`).join('');return `<article class="card" data-id="${q.id}"><div class="question"><span class="q-badge">${q.id} · ${esc(q.kind)}${q.difficulty?` · ${esc(q.difficulty)}${q.score?` · ${esc(q.score)}`:''}`:''}</span>${esc(q.stem)}</div><div class="options">${opts}</div>${imgs?`<div class="question-images">${imgs}</div>`:''}<details class="answer"><summary>查看答案与解析</summary><div class="answer-content"><div class="correct">正确答案：${esc(q.answer)}</div><div class="explanation">${esc(q.explanation)}</div><div class="point">知识点：${esc(q.point)}</div></div></details><div class="actions"><span class="count">错过 ${n} 次</span><button class="wrong" data-wrong="${q.id}">错一次</button><button class="mastered" data-master="${q.id}" ${n===0?'disabled':''}>已学会</button></div></article>`}).join(''):'<div class="empty">没有找到匹配内容。可以试试章节名、题目关键词或知识点。</div>';}
function renderPreservingOpen(){const openIds=new Set([...list.querySelectorAll('.card details[open]')].map(x=>x.closest('.card').dataset.id));render();for(const id of openIds){const card=list.querySelector(`.card[data-id="${id}"]`);if(card)card.querySelector('details').open=true}}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});search.addEventListener('input',render);kindFilter.addEventListener('change',render);sort.addEventListener('change',render);list.addEventListener('click',e=>{const w=e.target.closest('[data-wrong]'),m=e.target.closest('[data-master]');if(w){wrong[w.dataset.wrong]=(Number(wrong[w.dataset.wrong])||0)+1;localStorage.setItem('md-choice-wrong-counts',JSON.stringify(wrong));renderPreservingOpen()}else if(m){wrong[m.dataset.master]=0;localStorage.setItem('md-choice-wrong-counts',JSON.stringify(wrong));renderPreservingOpen()}});document.querySelector('#all-toggle').addEventListener('click',e=>{const all=[...list.querySelectorAll('details')],open=all.some(x=>!x.open);all.forEach(x=>x.open=open);e.target.textContent=open?'收起全部答案':'展开全部答案'});render()})();
